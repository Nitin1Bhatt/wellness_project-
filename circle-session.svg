<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="circleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="60%" stop-color="#EFE6DA" />
      <stop offset="100%" stop-color="#DDCDB9" />
    </linearGradient>
    <radialGradient id="morningLight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFDF9" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F5E8D3" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#DFD0B8" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#circleBg)" />
  <circle cx="400" cy="240" r="230" fill="url(#morningLight)" />

  <!-- Studio Floor Line -->
  <line x1="60" y1="480" x2="740" y2="480" stroke="#D1C3AF" stroke-width="2" />

  <!-- Morning Circle of 5 Women in Gentle Synchronized Flow -->
  <!-- Figure 1 (Left Far) -->
  <g transform="translate(140, 480)" fill="#251E19" opacity="0.85">
    <ellipse cx="0" cy="0" rx="35" ry="5" fill="#B66E43" opacity="0.3" />
    <circle cx="0" cy="-100" r="14" />
    <path d="M-6 -85 L6 -85 L10 -40 L-10 -40 Z" />
    <path d="M-22 -40 C-18 -15 18 -15 22 -40 Z" />
    <path d="M-30 -10 C-20 -30 20 -30 30 -10 Z" />
  </g>

  <!-- Figure 2 (Left Mid) -->
  <g transform="translate(260, 480)" fill="#251E19" opacity="0.9">
    <ellipse cx="0" cy="0" rx="40" ry="6" fill="#6F856C" opacity="0.3" />
    <circle cx="0" cy="-120" r="16" />
    <path d="M-8 -102 L8 -102 L14 -45 L-14 -45 Z" />
    <path d="M-35 -10 C-25 -35 25 -35 35 -10 Z" />
  </g>

  <!-- Figure 3 (Center - Instructor Ishani guiding) -->
  <g transform="translate(400, 480)" fill="#201A15">
    <ellipse cx="0" cy="0" rx="55" ry="8" fill="#C28B47" opacity="0.4" />
    <circle cx="0" cy="-150" r="19" />
    <ellipse cx="0" cy="-172" rx="10" ry="8" fill="#15100C" />
    <path d="M-10 -130 L10 -130 L16 -50 L-16 -50 Z" />
    <!-- Arms sweeping gently overhead in expansive breath -->
    <path d="M-16 -120 C-35 -150 -20 -195 0 -210 C20 -195 35 -150 16 -120 Z" fill="#201A15" />
    <path d="M-45 -10 C-30 -40 30 -40 45 -10 Z" />
  </g>

  <!-- Figure 4 (Right Mid) -->
  <g transform="translate(540, 480)" fill="#251E19" opacity="0.9">
    <ellipse cx="0" cy="0" rx="40" ry="6" fill="#6F856C" opacity="0.3" />
    <circle cx="0" cy="-120" r="16" />
    <path d="M-8 -102 L8 -102 L14 -45 L-14 -45 Z" />
    <path d="M-35 -10 C-25 -35 25 -35 35 -10 Z" />
  </g>

  <!-- Figure 5 (Right Far) -->
  <g transform="translate(660, 480)" fill="#251E19" opacity="0.85">
    <ellipse cx="0" cy="0" rx="35" ry="5" fill="#B66E43" opacity="0.3" />
    <circle cx="0" cy="-100" r="14" />
    <path d="M-6 -85 L6 -85 L10 -40 L-10 -40 Z" />
    <path d="M-30 -10 C-20 -30 20 -30 30 -10 Z" />
  </g>

  <text x="400" y="540" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="600" fill="#3D3228" text-anchor="middle" letter-spacing="1">INTIMATE MORNING CIRCLE · MAX 5 WOMEN</text>
</svg>
