<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="vinyasaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2EFE9" />
      <stop offset="50%" stop-color="#E8E2D6" />
      <stop offset="100%" stop-color="#D5CBB9" />
    </linearGradient>
    <radialGradient id="vinyasaGlow" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#FAF7F2" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#E5D8C4" stop-opacity="0.1" />
    </radialGradient>
    <linearGradient id="sageWrap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F856C" />
      <stop offset="100%" stop-color="#4C5E4A" />
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#vinyasaBg)" />
  <circle cx="300" cy="270" r="220" fill="url(#vinyasaGlow)" />
  
  <!-- Subtle Geometry -->
  <circle cx="300" cy="270" r="170" fill="none" stroke="#6F856C" stroke-width="1.2" stroke-dasharray="5,5" opacity="0.3" />

  <!-- Instructor Illustration: Alignment & Dynamic Vinyasa Specialist -->
  <g transform="translate(300, 310)">
    <circle cx="0" cy="-140" r="40" fill="#2B211B" />
    <!-- Braided hair over shoulder -->
    <path d="M-22 -140 Q-38 -90 -28 -30 Q-22 20 -28 60" stroke="#2B211B" stroke-width="14" fill="none" stroke-linecap="round" />

    <!-- Head & Neck -->
    <path d="M-16 -50 L-16 -15 C-16 10 -8 18 0 18 C8 18 16 10 16 -15 L16 -50 Z" fill="#D3AE8F" />
    <ellipse cx="0" cy="-75" rx="40" ry="50" fill="#DCBA9C" />
    
    <!-- Facial Features: Calm, Focused Gazing Forward (Drishti) -->
    <path d="M-26 -92 Q-16 -98 -6 -92" stroke="#2B211B" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M6 -92 Q16 -98 26 -92" stroke="#2B211B" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <!-- Almond focused eyes -->
    <path d="M-24 -80 Q-16 -72 -8 -80 Q-16 -84 -24 -80 Z" fill="#2B211B" />
    <path d="M8 -80 Q16 -72 24 -80 Q16 -84 8 -80 Z" fill="#2B211B" />
    <path d="M0 -86 L1 -65 Q-2 -62 -4 -64" stroke="#BD9574" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M-12 -50 Q0 -44 12 -50" stroke="#9A4E31" stroke-width="2.2" fill="none" stroke-linecap="round" />

    <!-- Muted Olive/Sage Yoga Bodice & Linen Stole -->
    <path d="M-105 95 C-90 -5 -35 -30 -18 -15 L18 -15 C35 -30 90 -5 105 95 L125 440 L-125 440 Z" fill="#FAF7F2" />
    <path d="M-50 -10 C-20 60 -15 200 10 440 L65 440 C45 220 20 60 40 -10 Z" fill="url(#sageWrap)" opacity="0.9" />

    <!-- Alignment Mudra Hand -->
    <g transform="translate(0, 95)">
      <circle cx="0" cy="0" r="18" fill="#D3AE8F" />
      <path d="M-2 -20 L-2 15 Q-15 15 -12 -5 Z" fill="#DCBA9C" />
      <circle cx="10" cy="-5" r="4" fill="#C28B47" opacity="0.8" />
    </g>
  </g>

  <!-- Bottom Badge Strip -->
  <rect x="50" y="660" width="500" height="60" rx="30" fill="#FAF7F2" stroke="#D1C7B7" stroke-width="1.5" />
  <text x="300" y="696" font-family="'Cormorant Garamond', serif" font-size="19" font-weight="600" fill="#201A15" text-anchor="middle" letter-spacing="1">FACULTY · ALIGNMENT &amp; VINYASA FLOW</text>
</svg>
